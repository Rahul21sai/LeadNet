name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node --test scripts/geo/geo.test.mjs
      - run: npm run build
      - run: docker build --tag leadnet-api:check .
      - run: npm run eval -w @leadnet/api
      - run: npm run seed -w @leadnet/api
